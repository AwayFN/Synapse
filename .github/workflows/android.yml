# Construit l'application Android de Synapse (Synapse.apk) et la publie sur la page « Releases » du dépôt.
# V7 : l'APK contient Synapse lui-même (app/dist) : il marche sur le téléphone sans serveur, et se synchronise avec le
# Synapse central quand il répond.
#   - à chaque étiquette « v… » (ex. v7.0.0) : nouvelle version publiée, téléchargeable par tout le monde à
#     https://github.com/<dépôt>/releases/latest/download/Synapse.apk
#   - à la main (onglet Actions → « Application Android » → Run workflow) : un essai, sans publication.
#
# Signature : avec le secret SYNAPSE_KEYSTORE_BASE64 (une clé .jks en base64 ; mot de passe dans le secret
# SYNAPSE_KEYSTORE_PASSWORD, « synapse » sinon ; alias « synapse »), toutes les versions ont la même signature et
# s'installent par-dessus la précédente. Sans ce secret, chaque version a sa propre clé : pour mettre à jour, il faut
# désinstaller l'ancienne (après avoir vérifié que tout est synchronisé : le compte et le cerveau sont alors sur le
# Synapse central).
name: Application Android

on:
  push:
    # une étiquette v… : nouvelle version publiée
    tags: ['v*']
    # une modification de l'application Android : construction d'essai (sans publication)
    branches: ['**']
    paths: ['android/**', '.github/workflows/android.yml', 'app/central.json', 'app/dist/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.SYNAPSE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="7.0.0-essai.${GITHUB_RUN_NUMBER}"; fi
          # numéro de version Android : 7.0.0 → 70000, 7.1.2 → 70102 (toujours plus grand que le précédent)
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((10#${MA:-0} * 10000 + 10#${MI:-0} * 100 + 10#${PA:-0}))" >> "$GITHUB_OUTPUT"
          echo "adresse=$(jq -r '.adresse // ""' app/central.json)" >> "$GITHUB_OUTPUT"

      - name: Clé de signature permanente (si le secret existe)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SYNAPSE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/synapse.jks"
          echo "SYNAPSE_KEYSTORE_FILE=$RUNNER_TEMP/synapse.jks" >> "$GITHUB_ENV"

      - name: Construire l'APK
        env:
          SYNAPSE_KEYSTORE_PASSWORD: ${{ secrets.SYNAPSE_KEYSTORE_PASSWORD }}
        run: >
          gradle -p android assembleRelease --stacktrace --no-daemon
          -PversionName="${{ steps.v.outputs.name }}"
          -PversionCode="${{ steps.v.outputs.code }}"
          -PsynapseDepot="${{ github.repository }}"
          -PsynapseAdresse="${{ steps.v.outputs.adresse }}"

      - name: Synapse.apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Synapse.apk
          ls -la Synapse.apk

      # V7 : l'application contient Synapse lui-même ; sans ses pages, elle s'ouvrirait sur un écran vide
      - name: Vérifier que Synapse est dans l'APK
        run: |
          unzip -l Synapse.apk | grep -E "assets/web/" | head -20
          unzip -l Synapse.apk | grep -q "assets/web/index.html"
          unzip -l Synapse.apk | grep -qE "assets/web/assets/index-[A-Za-z0-9_-]+\.js"
          WANT=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' app/dist/index.html)
          unzip -l Synapse.apk | grep -q "assets/web/$WANT"

      - uses: actions/upload-artifact@v4
        with:
          name: Synapse-${{ steps.v.outputs.name }}
          path: Synapse.apk

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Synapse ${{ steps.v.outputs.name }}
          files: Synapse.apk
          body: |
            **Synapse pour Android** : télécharge `Synapse.apk` ci-dessous (depuis ton téléphone), ouvre-le et autorise l'installation.
            Ouvre Synapse : crée ton compte (ou connecte-toi). Synapse marche sur le téléphone même sans réseau et sans PC allumé ; tout se
            synchronise avec ton compte dès que le Synapse central répond, et tu retrouves tout sur ton PC en t'y connectant.

            Sur PC (Windows) : télécharge le code (« Source code (zip) »), extrais-le, puis double-clique sur « Lancer Synapse ».

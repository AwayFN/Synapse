# Construit l'application Android de Synapse (Synapse.apk) et la publie sur la page « Releases » du dépôt.
#   - à chaque étiquette « v… » (ex. v6.0.0) : nouvelle version publiée, téléchargeable par tout le monde à
#     https://github.com/<dépôt>/releases/latest/download/Synapse.apk
#   - à la main (onglet Actions → « Application Android » → Run workflow) : un essai, sans publication.
#
# Signature : avec le secret SYNAPSE_KEYSTORE_BASE64 (une clé .jks en base64 ; mot de passe dans le secret
# SYNAPSE_KEYSTORE_PASSWORD, « synapse » sinon ; alias « synapse »), toutes les versions ont la même signature et
# s'installent par-dessus la précédente. Sans ce secret, chaque version a sa propre clé : pour mettre à jour, il faut
# désinstaller l'ancienne (le compte et les données restent sur le serveur, rien n'est perdu).
name: Application Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.SYNAPSE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="6.0.0-essai.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((600 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "adresse=$(jq -r '.adresse // ""' app/central.json)" >> "$GITHUB_OUTPUT"

      - name: Clé de signature permanente (si le secret existe)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SYNAPSE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/synapse.jks"
          echo "SYNAPSE_KEYSTORE_FILE=$RUNNER_TEMP/synapse.jks" >> "$GITHUB_ENV"

      - name: Construire l'APK
        env:
          SYNAPSE_KEYSTORE_PASSWORD: ${{ secrets.SYNAPSE_KEYSTORE_PASSWORD }}
        run: >
          gradle -p android assembleRelease --stacktrace --no-daemon
          -PversionName="${{ steps.v.outputs.name }}"
          -PversionCode="${{ steps.v.outputs.code }}"
          -PsynapseDepot="${{ github.repository }}"
          -PsynapseAdresse="${{ steps.v.outputs.adresse }}"

      - name: Synapse.apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Synapse.apk
          ls -la Synapse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Synapse-${{ steps.v.outputs.name }}
          path: Synapse.apk

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Synapse ${{ steps.v.outputs.name }}
          files: Synapse.apk
          body: |
            **Synapse pour Android** : télécharge `Synapse.apk` ci-dessous (depuis ton téléphone), ouvre-le et autorise l'installation.
            Ouvre Synapse : crée ton compte (ou connecte-toi). Tout ce que tu fais apparaît en direct sur ton PC, et l'inverse.

            Sur PC (Windows) : télécharge le code (« Source code (zip) »), extrais-le, puis double-clique sur « Lancer Synapse ».

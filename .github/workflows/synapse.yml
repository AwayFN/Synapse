# Construit les deux versions de Synapse (V8, 100 % local) et les publie sur la page « Releases » du dépôt :
#   - Synapse-Setup.exe : l'installateur Windows (icône Synapse sur le bureau, double-clic = l'application) ;
#   - Synapse.apk       : l'application Android (icône sur l'écran d'accueil).
# Les deux contiennent la même application (app/, compilée dans app/dist), et rien d'autre : pas de serveur, pas de compte.
#
#   - à chaque étiquette « v… » (ex. v8.0.0) : nouvelle version publiée, téléchargeable par tout le monde à
#       https://github.com/<dépôt>/releases/latest/download/Synapse-Setup.exe
#       https://github.com/<dépôt>/releases/latest/download/Synapse.apk
#   - à chaque modification (et à la main : onglet Actions → « Synapse » → Run workflow) : un essai, sans publication.
#     L'application Android est alors aussi lancée sur un téléphone Android simulé, pour vérifier qu'elle s'ouvre.
#
# Signature Android : avec le secret SYNAPSE_KEYSTORE_BASE64 (une clé .jks en base64 ; mot de passe dans le secret
# SYNAPSE_KEYSTORE_PASSWORD, « synapse » sinon ; alias « synapse »), toutes les versions ont la même signature et
# s'installent par-dessus la précédente, sans rien perdre. Sans ce secret, chaque version a sa propre clé : pour mettre à
# jour, il faut désinstaller l'ancienne (exporter d'abord ses données, ou reprendre la sauvegarde de Documents/Synapse).
name: Synapse

on:
  push:
    tags: ['v*']
    branches: ['**']
    paths: ['app/**', 'android/**', 'desktop/**', '.github/workflows/synapse.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Application (app/dist)
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="8.1.0-essai.${GITHUB_RUN_NUMBER}"; fi
          # numéro de version Android : 8.0.0 → 80000, 8.1.2 → 80102 (toujours plus grand que le précédent)
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((10#${MA:-0} * 10000 + 10#${MI:-0} * 100 + 10#${PA:-0}))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Compiler l'application
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: app/dist

  android:
    name: Application Android (Synapse.apk)
    needs: web
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.SYNAPSE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: app/dist

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Clé de signature permanente (si le secret existe)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SYNAPSE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/synapse.jks"
          echo "SYNAPSE_KEYSTORE_FILE=$RUNNER_TEMP/synapse.jks" >> "$GITHUB_ENV"

      - name: Construire l'APK
        env:
          SYNAPSE_KEYSTORE_PASSWORD: ${{ secrets.SYNAPSE_KEYSTORE_PASSWORD }}
        run: >
          gradle -p android assembleRelease --stacktrace --no-daemon
          -PversionName="${{ needs.web.outputs.name }}"
          -PversionCode="${{ needs.web.outputs.code }}"

      - name: Synapse.apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Synapse.apk
          ls -la Synapse.apk

      # l'application contient Synapse lui-même ; sans ses pages, elle s'ouvrirait sur un écran vide
      - name: Vérifier que Synapse est dans l'APK
        run: |
          unzip -l Synapse.apk | grep -E "assets/web/" | head -20
          unzip -l Synapse.apk | grep -q "assets/web/index.html"
          WANT=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' app/dist/index.html)
          unzip -l Synapse.apk | grep -q "assets/web/$WANT"

      # 100 % local : l'application ne doit pas avoir la permission d'accéder à Internet
      - name: Vérifier que l'APK n'a pas accès à Internet
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT2" dump permissions Synapse.apk | tee permissions.txt
          if grep -qE "android.permission.(INTERNET|ACCESS_NETWORK_STATE)" permissions.txt; then echo "::error::l'APK demande l'accès à Internet"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Synapse-android
          path: Synapse.apk

  android-essai:
    name: Essai sur un téléphone Android simulé
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Synapse-android

      - name: Accélération du téléphone simulé (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ouvrir Synapse sur le téléphone simulé
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r Synapse.apk
            adb logcat -c
            adb shell am start -W -n io.github.awayfn.synapse/.MainActivity
            for i in $(seq 1 40); do adb logcat -d -s Synapse:I | grep -q "page prete" && break; sleep 3; done
            adb exec-out screencap -p > ecran-android.png
            adb logcat -d -s Synapse:I chromium:I > logcat.txt || true
            cat logcat.txt
            grep -q 'page prete : "interface|' logcat.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essai-android
          path: |
            ecran-android.png
            logcat.txt

  windows:
    name: Application Windows (Synapse-Setup.exe)
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: desktop/web

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Construire l'installateur
        working-directory: desktop
        shell: bash
        env:
          # l'installateur télécharge lui-même ce qu'il faut ; pas de certificat de signature
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci --no-audit --no-fund
          npm version "${{ needs.web.outputs.name }}" --no-git-tag-version --allow-same-version
          test -f web/index.html
          npx electron-builder --win nsis --publish never
          ls -la release
          test -f release/Synapse-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Synapse-windows
          path: desktop/release/Synapse-Setup.exe

  release:
    name: Publier la version
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Synapse-android
      - uses: actions/download-artifact@v4
        with:
          name: Synapse-windows

      - uses: softprops/action-gh-release@v2
        with:
          name: Synapse ${{ needs.web.outputs.name }}
          files: |
            Synapse-Setup.exe
            Synapse.apk
          body: |
            **Synapse : ton réseau personnel en 3D, 100 % local.** Pas de compte, pas de connexion : tout reste sur ton appareil.

            **Windows** : télécharge `Synapse-Setup.exe` ci-dessous et ouvre-le. Synapse s'installe, une icône **Synapse** apparaît
            sur le bureau : un double-clic l'ouvre (le fichier d'installation s'efface tout seul ensuite). (Si Windows affiche
            « Windows a protégé votre ordinateur » : *Informations complémentaires* → *Exécuter quand même*.)

            **Android** : depuis le téléphone, télécharge `Synapse.apk`, ouvre-le et autorise l'installation. Un appui sur l'icône
            Synapse ouvre l'application.

            Les deux versions sont indépendantes : pour copier tes données de l'une à l'autre, `Ctrl K` → « Exporter mes données »,
            puis « Importer » de l'autre côté.

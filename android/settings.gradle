// Synapse pour Android : Synapse lui-même, dans le téléphone, 100 % local (sans Internet, sans compte). Voir README.md.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'Synapse'
include ':app'

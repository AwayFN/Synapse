// Synapse pour Android : Synapse lui-même, dans le téléphone (il marche sans serveur et se synchronise avec le Synapse central). Voir README.md.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'Synapse'
include ':app'

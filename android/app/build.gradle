plugins {
    id 'com.android.application'
}

// Réglages passés par la construction automatique sur GitHub (.github/workflows/android.yml) :
//   -PversionName=6.0.0 -PversionCode=612 -PsynapseDepot=AwayFN/Synapse -PsynapseAdresse=https://…
def prop = { String name, String fallback -> (project.findProperty(name) ?: fallback).toString() }
def depot = prop('synapseDepot', 'AwayFN/Synapse')
def adresse = prop('synapseAdresse', '')
def keystore = System.getenv('SYNAPSE_KEYSTORE_FILE')
def signed = keystore != null && new File(keystore).exists()

android {
    namespace 'io.github.awayfn.synapse'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.awayfn.synapse'
        minSdk 26
        targetSdk 35
        versionCode prop('versionCode', '600').toInteger()
        versionName prop('versionName', '6.0.0')
        // le dépôt GitHub où le Synapse central publie son adresse (branche synapse-adresse, fichier adresse.json)
        buildConfigField 'String', 'DEPOT', "\"${depot}\""
        buildConfigField 'String', 'BRANCHE', '"synapse-adresse"'
        buildConfigField 'String', 'FICHIER', '"adresse.json"'
        // une adresse fixe (hébergeur, domaine), si le Synapse central en a une (app/central.json)
        buildConfigField 'String', 'ADRESSE_FIXE', "\"${adresse}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // une clé de signature permanente (secret GitHub SYNAPSE_KEYSTORE_BASE64) : les mises à jour s'installent
        // par-dessus l'ancienne version. Sans elle, chaque version est signée avec une clé de construction.
        stable {
            if (signed) {
                storeFile file(keystore)
                storePassword System.getenv('SYNAPSE_KEYSTORE_PASSWORD') ?: 'synapse'
                keyAlias System.getenv('SYNAPSE_KEY_ALIAS') ?: 'synapse'
                keyPassword System.getenv('SYNAPSE_KEY_PASSWORD') ?: (System.getenv('SYNAPSE_KEYSTORE_PASSWORD') ?: 'synapse')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signed ? signingConfigs.stable : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

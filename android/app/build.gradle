plugins {
    id 'com.android.application'
}

// Réglages passés par la construction automatique sur GitHub (.github/workflows/synapse.yml) :
//   -PversionName=8.0.0 -PversionCode=80000
def prop = { String name, String fallback -> (project.findProperty(name) ?: fallback).toString() }
def keystore = System.getenv('SYNAPSE_KEYSTORE_FILE')
def signed = keystore != null && new File(keystore).exists()

// Synapse lui-même (l'application compilée, app/dist) est DANS l'APK : il marche sur le téléphone, sans réseau.
// Copié à chaque construction dans les « assets » (dossier web/), servi par MainActivity.
def webDist = new File(rootDir, '../app/dist')
def webOut = layout.buildDirectory.dir('generated/synapse-web').get().asFile
def copySynapseWeb = tasks.register('copySynapseWeb', Copy) {
    from(webDist)
    into(new File(webOut, 'web'))
    doFirst {
        if (!new File(webDist, 'index.html').exists()) {
            throw new GradleException("app/dist/index.html introuvable : compile d'abord Synapse (dans app/ : npm run build)")
        }
    }
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn(copySynapseWeb) }

android {
    namespace 'io.github.awayfn.synapse'
    compileSdk 35

    sourceSets {
        main {
            assets.srcDirs += [webOut]
        }
    }

    defaultConfig {
        applicationId 'io.github.awayfn.synapse'
        minSdk 26
        targetSdk 35
        versionCode prop('versionCode', '80000').toInteger()
        versionName prop('versionName', '8.0.0')
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // une clé de signature permanente (secret GitHub SYNAPSE_KEYSTORE_BASE64) : les mises à jour s'installent
        // par-dessus l'ancienne version, sans rien perdre. Sans elle, chaque version est signée avec une clé de construction.
        stable {
            if (signed) {
                storeFile file(keystore)
                storePassword System.getenv('SYNAPSE_KEYSTORE_PASSWORD') ?: 'synapse'
                keyAlias System.getenv('SYNAPSE_KEY_ALIAS') ?: 'synapse'
                keyPassword System.getenv('SYNAPSE_KEY_PASSWORD') ?: (System.getenv('SYNAPSE_KEYSTORE_PASSWORD') ?: 'synapse')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signed ? signingConfigs.stable : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
